<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("sb-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <title>Weekly Event</title>
  <meta name="description" content="This week's singing event: tap I'm in, add your songs and see your line-up.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="ev-page">
    <div class="ev-wrap">
      <div class="ev-head">
        <h1 id="evTitle">Weekly Event</h1>
        <p id="evWhen">Loading…</p>
        <p id="evNotes" class="ev-notes" hidden></p>
      </div>

      <!-- Line-up (when published) -->
      <section class="ev-card" id="lineupCard" hidden>
        <h2>🎵 Your songs this week</h2>
        <div id="lineupBody"></div>
      </section>

      <!-- Join + songs: one form -->
      <form class="ev-card" id="joinForm" novalidate hidden>
        <div id="who"></div>
        <div id="joinError" class="alert alert-error hidden"></div>

        <div id="idFields">
          <label class="ev-label" for="vPhone">Your mobile number</label>
          <input class="ev-input" id="vPhone" name="phone" type="tel" inputmode="tel" placeholder="98400 11223" autocomplete="tel">
          <div id="pinRow" class="hidden">
            <label class="ev-label" for="vPin">PIN <small>(first PIN = last 4 digits of your phone)</small></label>
            <input class="ev-input" id="vPin" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
          </div>
          <div id="newRow" class="hidden">
            <label class="ev-label" for="vName">Your name</label>
            <input class="ev-input" id="vName" name="name" maxlength="80" autocomplete="name">
            <div class="ev-gender" role="radiogroup" aria-label="You sing as">
              <label><input type="radio" name="gender" value="Male"> 👨 Male</label>
              <label><input type="radio" name="gender" value="Female"> 👩 Female</label>
            </div>
          </div>
        </div>

        <div class="ev-choice" role="radiogroup" aria-label="Are you singing this week?">
          <label><input type="radio" name="going" value="1"> <span>🎤 I'm in</span></label>
          <label><input type="radio" name="going" value="0"> <span>Not this week</span></label>
        </div>

        <div id="songsBox" class="hidden">
          <div class="ev-songs">
            <h3>🎙️ Solo songs</h3>
            <div id="soloRows"></div>
            <button type="button" class="ev-add" data-add="solo">+ Add solo song</button>
          </div>
          <div class="ev-songs">
            <h3>🎶 Duet songs</h3>
            <div id="duetRows"></div>
            <button type="button" class="ev-add" data-add="duet">+ Add duet song</button>
          </div>
        </div>

        <div class="ev-submit"><button class="btn btn-primary btn-lg btn-block" id="submitBtn">Submit</button></div>
      </form>

      <section class="ev-card" id="closedCard" hidden></section>

      <section class="ev-card" id="videoCard" hidden>
        <h2>🎬 Videos</h2>
        <a class="btn btn-primary btn-block" id="videoLink" target="_blank" rel="noopener">Open this week's videos ↗</a>
      </section>

      <section class="ev-card" id="pastCard" hidden>
        <h2>Your recent weeks</h2>
        <div id="pastList"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
