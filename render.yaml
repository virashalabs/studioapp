# Render Blueprint: free web service.
# The free plan's disk is wiped on every deploy/restart, so the database and uploaded images are
# mirrored to a private Supabase Storage bucket (see persist.js) and restored on start.
services:
  - type: web
    name: studio-booking
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Supabase project URL (https://xxxx.supabase.co) and its service_role key (Project Settings -> API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Private Storage bucket that holds db/, uploads/ and backups/
      - key: SUPABASE_BUCKET
        value: studio
      # Main domain, e.g. rhythmrehearsalstudio.online. Set it only once that domain works over HTTPS.
      - key: CANONICAL_HOST
        sync: false
      # Comma-separated hosts that 301-redirect to CANONICAL_HOST, e.g. studio.virashalabs.online,www.rhythmrehearsalstudio.online
      - key: REDIRECT_HOSTS
        sync: false
